name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (empty = nightly)"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - os: macos-15
            target: x86_64-apple-darwin
            asset: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Point build scripts at system protoc
        run: echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: pager-bin-${{ matrix.target }}

      - name: Build pager
        run: cargo build -p xai-grok-pager-bin --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release/xai-grok-pager"
          strip "$src" || true
          mkdir -p dist
          cp "$src" "dist/grok-cursor-${{ matrix.asset }}"
          chmod +x "dist/grok-cursor-${{ matrix.asset }}"
          (cd dist && shasum -a 256 "grok-cursor-${{ matrix.asset }}" > "grok-cursor-${{ matrix.asset }}.sha256")
          file "dist/grok-cursor-${{ matrix.asset }}"
          "dist/grok-cursor-${{ matrix.asset }}" --version

      - uses: actions/upload-artifact@v4
        with:
          name: grok-cursor-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release identity
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="nightly"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          prerelease=false
          if [ "${TAG}" = "nightly" ]; then
            prerelease=true
          fi
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Add versioned copies
        run: |
          set -euo pipefail
          cd dist
          for asset in linux-x86_64 macos-aarch64 macos-x86_64; do
            cp "grok-cursor-${asset}" "grok-cursor-${{ steps.meta.outputs.version }}-${asset}"
            cp "grok-cursor-${asset}.sha256" "grok-cursor-${{ steps.meta.outputs.version }}-${asset}.sha256"
            sed -i "s/grok-cursor-${asset}/grok-cursor-${{ steps.meta.outputs.version }}-${asset}/" \
              "grok-cursor-${{ steps.meta.outputs.version }}-${asset}.sha256"
          done
          cat grok-cursor-*.sha256 > SHA256SUMS
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
